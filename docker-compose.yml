services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - database.env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - database.env
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: